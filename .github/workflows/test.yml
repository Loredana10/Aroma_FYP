name: Aroma Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:

  python-unit-tests:
    name: Python recommender unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install "numpy==1.26.4" "pandas==2.2.2" "scikit-learn==1.4.2" "scipy==1.13.0" flask psycopg2-binary

      - name: Run Python unit tests
        working-directory: backend
        run: python test_unit_recommender.py -v

  node-unit-tests:
    name: Node.js API unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        working-directory: backend
        run: npm ci

      - name: Run Jest unit tests
        working-directory: backend
        run: npx jest --verbose --forceExit